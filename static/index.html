<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-dot.connected { background: #4ade80; }
        .status-dot.listening { background: #60a5fa; animation: pulse 1s infinite; }
        .status-dot.processing { background: #fbbf24; animation: pulse 0.5s infinite; }
        .status-dot.speaking { background: #a78bfa; animation: pulse 0.3s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .mic-button {
            display: block;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
        }
        
        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(59, 130, 246, 0.7);
        }
        
        .mic-button.recording {
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            animation: pulse 1s infinite;
        }
        
        .mic-button:disabled {
            background: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 60px;
            gap: 3px;
            margin-bottom: 30px;
        }
        
        .visualizer-bar {
            width: 4px;
            background: linear-gradient(to top, #3b82f6, #8b5cf6);
            border-radius: 2px;
            transition: height 0.1s;
        }
        
        .conversation {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
        }
        
        .message.user {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            margin-left: auto;
        }
        
        .message.assistant {
            background: rgba(255,255,255,0.1);
        }
        
        .message-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
        }
        
        .message-text {
            line-height: 1.5;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .controls button {
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .controls button:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice AI Platform</h1>
        <p class="subtitle">Speak naturally - I'll respond in real-time</p>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="connectionDot"></div>
                <span id="connectionStatus">Disconnected</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="stateDot"></div>
                <span id="stateStatus">Idle</span>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <button class="mic-button" id="micButton" disabled>🎤</button>
        
        <div class="visualizer" id="visualizer">
            <!-- Bars added by JS -->
        </div>
        
        <div class="conversation" id="conversation">
            <div style="text-align: center; color: #666; padding: 40px;">
                Click the microphone and start speaking
            </div>
        </div>
        
        <div class="controls">
            <button onclick="clearConversation()">Clear</button>
            <button onclick="toggleConnection()">Reconnect</button>
        </div>
    </div>

    <script>
        // Configuration
        const WS_URL = `ws://${window.location.hostname}:8000/ws/voice`;
        const SAMPLE_RATE = 16000;
        const CHUNK_SIZE = 512; // Silero VAD requirement
        
        // State
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let isRecording = false;
        let audioQueue = [];
        let isPlaying = false;
        
        // Elements
        const micButton = document.getElementById('micButton');
        const connectionDot = document.getElementById('connectionDot');
        const connectionStatus = document.getElementById('connectionStatus');
        const stateDot = document.getElementById('stateDot');
        const stateStatus = document.getElementById('stateStatus');
        const conversation = document.getElementById('conversation');
        const errorDiv = document.getElementById('error');
        const visualizer = document.getElementById('visualizer');
        
        // Create visualizer bars
        for (let i = 0; i < 32; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            bar.style.height = '4px';
            visualizer.appendChild(bar);
        }
        const visualizerBars = visualizer.querySelectorAll('.visualizer-bar');
        
        // Initialize
        connect();
        
        function connect() {
            if (ws) {
                ws.close();
            }
            
            updateConnection('connecting');
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
            };
            
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                console.log('Received:', msg);
                
                switch (msg.type) {
                    case 'status':
                        updateState(msg.status);
                        if (msg.status === 'ready') {
                            updateConnection('connected');
                            micButton.disabled = false;
                        }
                        break;
                    
                    case 'transcript':
                        addMessage('user', msg.text);
                        break;
                    
                    case 'response':
                        addMessage('assistant', msg.text);
                        break;
                    
                    case 'audio':
                        await playAudio(msg.data, msg.sample_rate);
                        break;
                }
            };
            
            ws.onclose = () => {
                updateConnection('disconnected');
                micButton.disabled = true;
                stopRecording();
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showError('Connection error. Is the server running?');
            };
        }
        
        function updateConnection(state) {
            connectionDot.className = 'status-dot';
            switch (state) {
                case 'connected':
                    connectionDot.classList.add('connected');
                    connectionStatus.textContent = 'Connected';
                    break;
                case 'connecting':
                    connectionStatus.textContent = 'Connecting...';
                    break;
                case 'disconnected':
                    connectionStatus.textContent = 'Disconnected';
                    break;
            }
        }
        
        function updateState(state) {
            stateDot.className = 'status-dot';
            stateDot.classList.add(state);
            stateStatus.textContent = state.charAt(0).toUpperCase() + state.slice(1);
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function addMessage(role, text) {
            // Remove placeholder if exists
            const placeholder = conversation.querySelector('div[style]');
            if (placeholder) placeholder.remove();
            
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.innerHTML = `
                <div class="message-label">${role === 'user' ? 'You' : 'Assistant'}</div>
                <div class="message-text">${text}</div>
            `;
            conversation.appendChild(msg);
            conversation.scrollTop = conversation.scrollHeight;
        }
        
        function clearConversation() {
            conversation.innerHTML = `
                <div style="text-align: center; color: #666; padding: 40px;">
                    Click the microphone and start speaking
                </div>
            `;
        }
        
        function toggleConnection() {
            connect();
        }
        
        // Microphone handling
        micButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
        
        async function startRecording() {
            try {
                audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                    } 
                });
                
                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(CHUNK_SIZE, 1, 1);
                
                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    
                    const inputData = e.inputBuffer.getChannelData(0);
                    
                    // Update visualizer
                    updateVisualizer(inputData);
                    
                    // Convert to int16 and send
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        int16Data[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    
                    // Send as base64
                    const base64 = btoa(String.fromCharCode(...new Uint8Array(int16Data.buffer)));
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'audio', data: base64 }));
                    }
                };
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                
                isRecording = true;
                micButton.classList.add('recording');
                micButton.textContent = '⏹';
                
            } catch (error) {
                console.error('Microphone error:', error);
                showError('Could not access microphone. Please allow microphone access.');
            }
        }
        
        function stopRecording() {
            isRecording = false;
            micButton.classList.remove('recording');
            micButton.textContent = '🎤';
            
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            // Reset visualizer
            visualizerBars.forEach(bar => bar.style.height = '4px');
        }
        
        function updateVisualizer(audioData) {
            const step = Math.floor(audioData.length / visualizerBars.length);
            for (let i = 0; i < visualizerBars.length; i++) {
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    sum += Math.abs(audioData[i * step + j]);
                }
                const avg = sum / step;
                const height = Math.max(4, Math.min(60, avg * 500));
                visualizerBars[i].style.height = `${height}px`;
            }
        }
        
        // Audio playback
        async function playAudio(base64Data, sampleRate) {
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            // Convert int16 to float32
            const int16Data = new Int16Array(bytes.buffer);
            const float32Data = new Float32Array(int16Data.length);
            for (let i = 0; i < int16Data.length; i++) {
                float32Data[i] = int16Data[i] / 32768;
            }
            
            // Create audio buffer and play
            const playbackContext = new AudioContext({ sampleRate: sampleRate });
            const buffer = playbackContext.createBuffer(1, float32Data.length, sampleRate);
            buffer.copyToChannel(float32Data, 0);
            
            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackContext.destination);
            source.start();
            
            // Wait for playback to finish
            await new Promise(resolve => {
                source.onended = resolve;
            });
            
            playbackContext.close();
        }
    </script>
</body>
</html>
