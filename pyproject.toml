[project]
name = "voice-ai-platform"
version = "1.0.0"
description = "Production-grade Voice AI Platform with telephony support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    
    # Audio processing
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    
    # ML models
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.16.0",
    
    # TTS
    "kokoro>=0.1.0",
    "edge-tts>=6.1.0",
    
    # LLM
    "ollama>=0.3.0",
    "httpx>=0.26.0",
    
    # Telephony
    "twilio>=8.10.0",
    
    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_platform"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

