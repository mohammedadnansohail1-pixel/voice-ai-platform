[project]
name = "voice-ai-platform"
version = "1.0.0"
description = "Production-grade Voice AI Platform for Healthcare"
requires-python = ">=3.10"

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    
    # Audio
    "sounddevice>=0.4",
    "numpy>=1.24",
    
    # ASR
    "faster-whisper>=1.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    
    # TTS
    "kokoro>=0.3",
    
    # LLM
    "httpx>=0.25",
    
    # API
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "websockets>=12.0",
    
    # Observability
    "prometheus-client>=0.19",
    "structlog>=24.0",
    
    # Utilities
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
